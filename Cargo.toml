[package]
name = "wgpu-wasi-webgpu"
version = "30.0.0"
edition = "2024"
license = "MIT"
description = "wgpu's custom dispatch traits over wasi:webgpu@0.3.0-rc.2, so a renderer written against wgpu runs in a wasm32-wasip2 component. Empty on other targets."
repository = "https://github.com/imbcmdth/wgpu-wasi-webgpu"
readme = "README.md"
keywords = ["wgpu", "webgpu", "wasi", "wasm", "component"]
categories = ["graphics", "wasm"]
include = ["/src", "/wit", "/README.md", "/LICENSE"]

[lib]
name = "wgpu_wasi_webgpu"

[dependencies]
# The crate's major is wgpu's. `custom` exposes the dispatch traits; the
# default features stay off, `webgpu` among them (see the README).
wgpu = { version = "30", default-features = false, features = ["custom", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.57.1"

# For tests/gpu.rs, which runs the modules under tests/modules through the
# ffrwd sidecar and renders the vello scene natively to compare.
[dev-dependencies]
scene = { path = "tests/modules/scene" }
vello_cpu = { version = "0.1", default-features = false, features = ["std", "f32_pipeline"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
